<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f4f1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Obliq" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Obliq</title>
    <script>
      // O tema precisa valer antes da primeira pintura, senao a abertura pisca
      // claro para quem escolheu escuro.
      try {
        var t = localStorage.getItem('obliq-tema')
        document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <style>
      /* Tela de carregamento sem JS nenhum: e o que aparece entre abrir o app e
         o React montar. Sai sozinha, porque o React substitui o #root inteiro. */
      #partida {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #f6f4f1;
        font-family: Archivo, system-ui, sans-serif;
      }
      html[data-theme='dark'] #partida { background: #101015; }
      #partida b {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: #101016;
      }
      html[data-theme='dark'] #partida b { color: #f3f1ed; }
      #partida b i { font-style: normal; color: #e8000d; }
      #partida span {
        width: 5rem;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(128, 120, 110, 0.2);
      }
      #partida span::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #e8000d;
        animation: correr 1.1s ease-in-out infinite;
      }
      @keyframes correr {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #partida span::after { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <a href="#conteudo" style="position:absolute;left:-9999px;top:0;z-index:200;padding:.6rem 1rem;background:#e8000d;color:#fff;border-radius:0 0 .5rem 0" onfocus="this.style.left=0" onblur="this.style.left='-9999px'">Pular para o conteúdo</a>
    <div id="root">
      <div id="partida">
        <b>OBL<i>IQ</i></b>
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
